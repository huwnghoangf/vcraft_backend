spring:
  application:
    name: vcraft-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vcraft_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway chịu trách nhiệm quản lý cấu trúc bảng, Hibernate chỉ kiểm tra hợp lệ
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

jwt:
  secret: ${JWT_SECRET:}
  access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}
  refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}

app:
  password-reset-url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${SMTP_FROM:noreply@vcraft.local}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:8080}
