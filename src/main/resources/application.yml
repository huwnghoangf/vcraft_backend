spring:
  application:
    name: vcraft-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vcraft_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway chịu trách nhiệm quản lý cấu trúc bảng, Hibernate chỉ kiểm tra hợp lệ
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

jwt:
  secret: ${JWT_SECRET:vcraft-bat-trang-secret-key-32chars-minimum-token}
  access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}
  refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}

app:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
