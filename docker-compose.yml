name: vcraft

services:
  postgres:
    image: postgres:15-alpine
    container_name: vcraft_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vcraft_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vcraft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vcraft_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vcraft_net

  backend:
    build: .
    image: vcraft-backend
    container_name: vcraft_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vcraft_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-vcraft-bat-trang-secret-key-32chars-minimum-token}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - vcraft_uploads:/app/uploads
    networks:
      - vcraft_net

volumes:
  vcraft_pgdata:
  vcraft_uploads:

networks:
  vcraft_net:
    driver: bridge
